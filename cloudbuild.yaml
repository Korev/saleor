steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t=${_REGISTRY}/saleor-backend:$BUILD_ID
      - -t=${_REGISTRY}/saleor-backend:latest
      - .

  # Push both tags
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/saleor-backend

  # Deploy Saleor API
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - saleor-api
      - --image=${_REGISTRY}/saleor-backend:$BUILD_ID
      - --region=europe-north1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=1
      - --max-instances=10
      - --service-account=${_API_SERVICE_ACCOUNT}
      - --vpc-connector=petvamily-vpc-connector
      - --vpc-egress=private-ranges-only
      - --set-env-vars=PUBLIC_URL=https://saleor-api-ibbupnwliq-lz.a.run.app
      - --set-secrets=DATABASE_URL=saleor-database-url:latest,REDIS_URL=saleor-redis-url:latest,SECRET_KEY=saleor-secret-key:latest,ALLOWED_HOSTS=saleor-allowed-hosts:latest,DEFAULT_FROM_EMAIL=saleor-default-from-email:latest,SALEOR_APP_TOKEN=saleor-app-token:latest,STOREFRONT_URL=saleor-storefront-url:latest,GS_MEDIA_BUCKET_NAME=saleor-gcs-media-bucket:latest

  # Deploy Celery worker (same image, custom entrypoint overrides uvicorn CMD)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - saleor-worker
      - --image=${_REGISTRY}/saleor-backend:$BUILD_ID
      - --region=europe-north1
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=1
      - --max-instances=3
      - --service-account=${_WORKER_SERVICE_ACCOUNT}
      - --vpc-connector=petvamily-vpc-connector
      - --vpc-egress=private-ranges-only
      - --command=/app/scripts/worker-entrypoint.sh
      - --set-secrets=DATABASE_URL=saleor-database-url:latest,REDIS_URL=saleor-redis-url:latest,SECRET_KEY=saleor-secret-key:latest,STOREFRONT_URL=saleor-storefront-url:latest,GS_MEDIA_BUCKET_NAME=saleor-gcs-media-bucket:latest,DEFAULT_FROM_EMAIL=saleor-default-from-email:latest,SALEOR_APP_TOKEN=saleor-app-token:latest

substitutions:
  _REGISTRY: europe-north1-docker.pkg.dev/vetfamily-494417/petvamily
  _API_SERVICE_ACCOUNT: saleor-api@vetfamily-494417.iam.gserviceaccount.com
  _WORKER_SERVICE_ACCOUNT: saleor-worker@vetfamily-494417.iam.gserviceaccount.com

images:
  - europe-north1-docker.pkg.dev/vetfamily-494417/petvamily/saleor-backend:$BUILD_ID
  - europe-north1-docker.pkg.dev/vetfamily-494417/petvamily/saleor-backend:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
